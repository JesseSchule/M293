<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt Jesse Brodbeck</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <ul>
        <li><a href="index.html">Über mich</a></li>
        <li><a href="faehigkeiten.html">Fähigkeit</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
</nav>

<main>
    <div class="contact-icons">
        <a href="tel:+41774745951" class="contact-icon-item">
            <img src="Bilder/telefon.png" alt="Telefon">
            <span class="teal-box contact-label">"Telefonnummer"</span>
        </a>
        <a href="https://instagram.com/" target="_blank" class="contact-icon-item">
            <img src="Bilder/instagram.avif" alt="Instagram">
            <span class="teal-box contact-label">"Instagram"</span>
        </a>
        <a href="mailto:jesse.brodbeck@edu.gbssg.ch" class="contact-icon-item">
            <img src="Bilder/mail.png" alt="E-Mail">
            <span class="teal-box contact-label">"E-Mail"</span>
        </a>
        <a href="https://linkedin.com/" target="_blank" class="contact-icon-item">
            <img src="Bilder/linkedin.webp" alt="LinkedIn">
            <span class="teal-box contact-label">"LinkedIn"</span>
        </a>
    </div>

    <div class="form-wrapper">
        <div class="teal-box form-title">Kontaktformular</div>
        <form action="#" method="post">
            <div class="form-row">
                <input type="text" name="vorname" placeholder="Vorname:" class="form-input" required>
                <input type="text" name="nachname" placeholder="Nachname:" class="form-input" required>
            </div>
            <textarea name="nachricht" placeholder="Nachricht eingeben:" class="form-textarea" required></textarea>
            <div class="form-submit">
                <button type="submit" class="btn">Absenden</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
